# storageprims cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# Graph Configuration
# ============================================================================
[graph]
all-features = true

# ============================================================================
# Output Configuration
# ============================================================================
[output]
feature-depth = 1

# ============================================================================
# Advisories (Security)
# ============================================================================
[advisories]
ignore = [
    # Upstream AWS SDK (pinned at aws-config 1.10.1 / aws-sdk-s3 1.142.0 for MSRV 1.94.1):
    # - RUSTSEC-2026-0387: aws-sigv4 1.5.1 -> p256 0.13.2 depends on crypto-bigint 0.5.x
    #   (patched in breaking 0.7.6; no semver-compatible upgrade available). Reachable only
    #   when asymmetric SigV4A ECDSA P-256 request signing is used (standard regional and
    #   S3-compatible requests sign with HMAC-SHA256 SigV4 and do not enter p256), and the
    #   advisory concerns local timing/microarchitectural side channels during signing.
    # - RUSTSEC-2026-0441: aws-smithy-{types,http,runtime} depend on archived pin-utils 0.1.0.
    #   Informational repository-archival notice only (no known soundness or security defect).
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0441",
]

# ============================================================================
# Licenses
# ============================================================================
[licenses]
confidence-threshold = 0.93
include-dev = true

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

exceptions = []

[licenses.private]
ignore = true

# ============================================================================
# Bans
# ============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ============================================================================
# Sources
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
