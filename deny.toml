# storageprims cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# Graph Configuration
# ============================================================================
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# ============================================================================
# Output Configuration
# ============================================================================
[output]
feature-depth = 1

# ============================================================================
# Advisories (Security)
# ============================================================================
[advisories]
ignore = [
    # Upstream AWS SDK: aws-smithy-http-client still ships hyper-rustls 0.24 /
    # rustls 0.21 alongside the modern rustls 0.23 stack. Tracked upstream in
    # smithy-rs; no fix available via dependency pin alone (verified at SDK 1.10.1).
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0258",
]

# ============================================================================
# Licenses
# ============================================================================
[licenses]
confidence-threshold = 0.93

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

exceptions = []

[licenses.private]
ignore = true

# ============================================================================
# Bans
# ============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ============================================================================
# Sources
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
