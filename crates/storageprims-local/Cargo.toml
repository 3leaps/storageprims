[package]
name = "storageprims-local"
description = "Rooted local filesystem provider for storageprims"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/storageprims-local"
readme = "README.md"
publish = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
getrandom = "0.4"
storageprims-core.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["process"] }
