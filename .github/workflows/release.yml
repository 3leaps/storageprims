# storageprims read-only release artifacts
#
# On a v* tag: restore and verify the signed annotated tag against the public
# pin committed in the tagged commit, then build the native FFI archives and
# the SBOM and keep them as workflow artifacts.
#
# This workflow holds no signing, release or registry authority. A green run is
# a consistency signal, not release authorization. The maintainer verifies the
# tag independently, binds it to main, creates the draft locally from these
# artifacts, signs the manifests and publishes.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  validate:
    name: Validate tag and package set
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: 1.94.1
      - name: Restore annotated tag and check VERSION
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORAGEPRIMS_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/release-restore-tag-ref.sh
          ./scripts/release-guard-tag-version.sh
          tag_object="$(git rev-parse "refs/tags/$STORAGEPRIMS_RELEASE_TAG")"
          commit="$(git rev-parse "refs/tags/$STORAGEPRIMS_RELEASE_TAG^{}")"
          {
            printf 'tag_object=%s\n' "$tag_object"
            printf 'commit=%s\n' "$commit"
            printf 'version=%s\n' "$(tr -d ' \t\r\n' < VERSION)"
          } >>"$GITHUB_OUTPUT"
          printf '{"tag":"%s","object":"%s","commit":"%s"}\n' \
            "$STORAGEPRIMS_RELEASE_TAG" "$tag_object" "$commit" >release-identity.json
      - name: Upload artifact identity and licenses
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-identity
          if-no-files-found: error
          retention-days: 30
          path: |
            release-identity.json
            LICENSE-MIT
            LICENSE-APACHE
      - name: Verify package archives without publishing
        run: make release-check
  verify-signature:
    name: Verify pinned tag signature
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact signed tag and committed pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify committed pin and GitHub signature
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          STORAGEPRIMS_RELEASE_TAG: ${{ github.ref_name }}
          STORAGEPRIMS_EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: |
          set -euo pipefail
          ./scripts/release-restore-tag-ref.sh
          ./scripts/verify-pinned-tag.sh
          EXPECTED_OBJECT="$(git rev-parse "refs/tags/$STORAGEPRIMS_RELEASE_TAG")"
          tag_json="$(gh api "repos/3leaps/storageprims/git/tags/$EXPECTED_OBJECT")"
          jq -e --arg tag "$STORAGEPRIMS_RELEASE_TAG" --arg commit "$(git rev-parse HEAD)" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and
             .verification.verified == true and .verification.reason == "valid"' \
            <<<"$tag_json" >/dev/null
  build-ffi:
    name: FFI (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            shared: libstorageprims_ffi.so
            static: libstorageprims_ffi.a
          - runner: ubuntu-latest-arm64-s
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            shared: libstorageprims_ffi.so
            static: libstorageprims_ffi.a
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            shared: libstorageprims_ffi.dylib
            static: libstorageprims_ffi.a
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Confirm annotated tag identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORAGEPRIMS_RELEASE_TAG: ${{ github.ref_name }}
          STORAGEPRIMS_EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          ./scripts/release-restore-tag-ref.sh
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: 1.94.1
      - name: Verify native runner
        run: |
          set -euo pipefail
          test "$(rustc -vV | awk '/^host:/{print $2}')" = "${{ matrix.target }}"
      - name: Build native FFI
        run: cargo build --package storageprims-ffi --release --locked
      - name: Package exact FFI archive
        env:
          STORAGEPRIMS_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_dir="dist/package"
          archive="storageprims-ffi-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.tar.gz"
          mkdir -p "$package_dir"
          cp "target/release/${{ matrix.static }}" "$package_dir/"
          cp "target/release/${{ matrix.shared }}" "$package_dir/"
          cp ffi/storageprims-ffi/storageprims.h "$package_dir/storageprims.h"
          cp LICENSE-MIT LICENSE-APACHE "$package_dir/"
          tar -czf "$archive" -C "$package_dir" \
            LICENSE-APACHE LICENSE-MIT "${{ matrix.static }}" \
            "${{ matrix.shared }}" storageprims.h
          source scripts/release-common.sh
          # shellcheck disable=SC2031
          validate_ffi_archive "$archive"
      - name: Upload FFI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffi-${{ matrix.platform }}
          path: storageprims-ffi-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30
  sbom:
    name: CycloneDX SBOM
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Confirm annotated tag identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORAGEPRIMS_RELEASE_TAG: ${{ github.ref_name }}
          STORAGEPRIMS_EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          ./scripts/release-restore-tag-ref.sh
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Generate SBOM with pinned Syft image
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            anchore/syft@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
            dir:. \
            --output "cyclonedx-json=sbom-${{ needs.validate.outputs.version }}.cdx.json"
          test -s "sbom-${{ needs.validate.outputs.version }}.cdx.json"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom-${{ needs.validate.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 30
