# goneat Dependencies Policy Configuration
# storageprims - GPL-free cloud storage primitives library
#
# This policy enforces license compliance and supply chain security.
version: v1
# License compliance policy
# Aligned with deny.toml (when created)
licenses:
  forbidden:
    - GPL-2.0
    - GPL-3.0
    - AGPL-3.0
    - LGPL-2.1
    - LGPL-3.0
  allowed:
    - MIT
    - Apache-2.0 WITH LLVM-exception
    - Apache-2.0
    - BSD-2-Clause
    - 0BSD
    - BSD-3-Clause
    - ISC
    - OpenSSL
    - Zlib
    - Unlicense
    - CC0-1.0
    - BSL-1.0
    - Unicode-3.0
    - Unicode-DFS-2016
# Supply chain security (cooling policy)
cooling:
  enabled: true
  min_age_days: 7
  min_downloads: 100
  alert_only: false
  grace_period_days: 3
  exceptions:
    - pattern: "github.com/3leaps/*"
      reason: "Internal packages"
    - pattern: "github.com/fulmenhq/*"
      reason: "Fulmen ecosystem packages"
    # Temporary cooling-window exceptions for RUSTSEC-2026-0592 (published 2026-11-20;
    # exclusive until date expires at 2026-11-29T00:00:00Z after 7-day cooling).
    - pattern: "url"
      reason: "RUSTSEC-2026-0592 security fix (url 2.5.9 published 2026-11-20)"
      until: "2026-11-29"
      approved_by: "@3leapsdave"
    - pattern: "form_urlencoded"
      reason: "Required by url 2.5.9 for RUSTSEC-2026-0592 (form_urlencoded 1.2.3 published 2026-11-20)"
      until: "2026-11-29"
      approved_by: "@3leapsdave"
# Policy engine configuration
policy_engine:
  type: embedded
# Language-specific settings
languages:
  - language: go
    paths:
      - bindings/go/go.mod
  - language: rust
    paths:
      - Cargo.toml
