[workspace]
resolver = "2"
members = [
    "crates/storageprims-core",
    "crates/storageprims-ops",
    "crates/storageprims-s3",
    # "crates/storageprims-gcs",
    # "crates/storageprims-azb",
    # "crates/storageprims-local",
    # "crates/storageprims-cli",
    "ffi/storageprims-ffi",
    # "bindings/typescript/storageprims/native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3leaps/storageprims"
authors = ["3leaps Architecture Council"]

[workspace.dependencies]
storageprims-core = { path = "crates/storageprims-core" }
storageprims-ops = { path = "crates/storageprims-ops" }
storageprims-s3 = { path = "crates/storageprims-s3" }
storageprims-ffi = { path = "ffi/storageprims-ffi" }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"

# Bytes
bytes = "1"
http-body = "1"
os_pipe = "1.2"
percent-encoding = "2.3"

# AWS
aws-config = "=1.8.13"
aws-credential-types = { version = "=1.2.11", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "=1.122.0", features = ["behavior-version-latest"] }
aws-smithy-runtime-api = "=1.11.3"
aws-smithy-types = "=1.4.3"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI (when storageprims-cli is added)
# clap = { version = "4.5", features = ["derive", "env"] }
